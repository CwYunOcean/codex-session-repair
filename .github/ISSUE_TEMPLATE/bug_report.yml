name: Bug report
description: 报告诊断、恢复或兼容性问题；请勿上传私人历史或凭据。
body:
  - type: markdown
    attributes:
      value: 请用合成历史复现。不要上传原始 JSONL、数据库、auth.json、API Key 或完整配置。
  - type: input
    id: versions
    attributes:
      label: 环境版本
      description: 系统、Python、Codex CLI 和工具版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果
      description: 包含命令及报错代码，移除私人路径、ID 和凭据。
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: 脱敏诊断
      description: 可贴 inspect --json 输出；先移除个人路径、项目名和会话 UUID。
      render: json
